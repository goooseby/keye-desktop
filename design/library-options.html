<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课页 · 资料库首页布局提案</title>
  <style>
    :root{font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:#1d3029;background:#f7faf8;--green:#17664f;--line:#d8e3dd;--muted:#66766f;--soft:#edf5f1;--shadow:0 5px 18px #284a3910}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #417f67;outline-offset:2px}
    .window{min-height:100vh;display:grid;grid-template-columns:214px minmax(0,1fr);grid-template-rows:55px minmax(0,1fr);background:#f8fbf9}
    .titlebar{grid-column:1/-1;background:#f3f8fd;border-bottom:1px solid #e2e9eb;display:flex;align-items:center;gap:8px;padding:0 17px;font-size:13px;color:#24392f}.titlebar img{width:22px;height:22px}.titlebar .win-actions{margin-left:auto;display:flex;gap:38px;font:18px "Segoe UI";color:#5f6b69}
    aside{grid-row:2;background:white;border-right:1px solid var(--line);padding:27px 14px;display:flex;flex-direction:column;gap:23px}.brand{display:flex;align-items:center;gap:12px;padding:0 9px}.brand img{width:42px;height:42px}.brand strong{display:block;font-size:20px;line-height:1}.brand strong span{font-size:10px;letter-spacing:2px;color:#4c6759;margin-left:5px}.brand small{display:block;font-size:10px;color:#76857d;margin-top:7px}.side-label{color:#82918a;font-size:11px;letter-spacing:.7px;padding:0 10px;margin-top:19px}.nav{display:grid;gap:5px}.nav span{display:flex;align-items:center;gap:12px;border-radius:9px;padding:12px 13px;font-size:14px;font-weight:650;color:#394d42}.nav span.active{background:#e3f0eb;color:#135c47}.nav b{width:17px;text-align:center;font-size:16px;font-weight:500}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:19px 11px 0;font-size:11px;color:#75867d;line-height:1.8}.side-bottom strong{display:block;color:#3c5f4d;font-size:12px}
    .workspace{grid-row:2;min-width:0;display:flex;flex-direction:column}.topbar{height:57px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:#65756d;font-size:12px}.topbar .right{display:flex;gap:18px;align-items:center}.topbar .pill{border:1px solid var(--line);padding:5px 11px;border-radius:18px;font-size:11px;background:#f8fbf9}
    .content{overflow:auto;flex:1;padding:20px 28px 35px}.demo-switch{display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:8px;border:1px solid #d8e2dc;border-radius:11px;background:#fff;box-shadow:var(--shadow)}.demo-switch .intro{font-size:11px;color:#66776d;padding:0 12px;min-width:205px}.demo-switch button{border:1px solid transparent;background:transparent;color:#53675b;border-radius:7px;padding:9px 13px;font-size:12px}.demo-switch button.active{background:#17664f;color:white}.demo-switch .hint{margin-left:auto;font-size:11px;color:#88968e;padding-right:10px}
    .variant{display:none;max-width:1640px;margin:auto}.variant.active{display:block}.head{display:flex;align-items:center;gap:18px;justify-content:space-between;margin:0 0 17px}.head h1{font-size:26px;line-height:1.2;margin:0}.head p{font-size:12px;color:#6a796f;margin:6px 0 0}.actions{display:flex;align-items:center;gap:8px}.btn{border:1px solid #cfddd5;background:white;color:#294339;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:650;white-space:nowrap}.btn.primary{background:#17664f;color:#fff;border-color:#17664f}.btn.small{padding:6px 10px;font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:19px 0 10px}.section-head h2{font-size:15px;margin:0}.section-head span,.section-head a{font-size:11px;color:#647a6a}.section-head a{text-decoration:none;color:#17664f;font-weight:650}.panel{border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:var(--shadow)}.muted{color:var(--muted)}.badge{display:inline-block;border-radius:5px;background:#e6f2ea;color:#266b50;padding:3px 7px;font-size:10px;font-weight:650;white-space:nowrap}.badge.warn{background:#faf0dd;color:#8a641a}.badge.blue{background:#ebf1f8;color:#456681}.search{border:1px solid #d4e0d9;border-radius:8px;background:#fff;padding:9px 12px;min-width:240px;color:#6c7a72;font-size:12px}.search input{border:0;outline:0;width:175px;color:#28392f;background:transparent}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:13px 0 10px}.tabs{display:flex;gap:19px;align-items:center;font-size:12px;color:#687a6e}.tabs strong{color:#155f49;padding-bottom:9px;border-bottom:2px solid #17664f}.tabs span{padding-bottom:9px}
    .cover{position:relative;overflow:hidden;border-radius:7px;background:var(--bg,#eff5f2);color:var(--ink,#2c5a49)}.cover:before{content:"";position:absolute;width:120px;height:120px;border:2px solid currentColor;opacity:.08;border-radius:24px;right:-35px;top:25px;transform:rotate(20deg)}.cover:after{content:"";position:absolute;width:80px;height:80px;border:13px solid currentColor;opacity:.07;right:16px;bottom:-33px;transform:rotate(-8deg)}.cover .micro{position:absolute;left:12px;top:10px;font-size:7px;letter-spacing:1.1px;opacity:.7}.cover strong{position:absolute;left:12px;top:39%;font-size:17px;z-index:1;max-width:78%;line-height:1.3}.cover .stripe{position:absolute;left:0;right:0;top:0;height:3px;background:currentColor;opacity:.7}
    .resume{display:flex;align-items:center;gap:16px;padding:13px 17px;min-height:72px}.resume .mini-cover{width:72px;height:45px;flex:none}.resume .mini-cover .cover{width:100%;height:100%}.resume-copy{min-width:0;flex:1}.resume-copy .label{font-size:10px;color:#43826c;font-weight:750}.resume-copy strong{display:block;font-size:14px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resume-copy small{font-size:11px;color:#6a7c71}.resume .btn{margin-left:auto}.resume .progress{width:90px;height:5px;border-radius:5px;background:#e8efe9;overflow:hidden}.resume .progress i{display:block;width:56%;height:100%;background:#4c9b78}
    .course-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.course-card{display:flex;gap:11px;min-height:116px;padding:11px}.course-card .cover{width:112px;min-width:112px;height:90px}.course-card .cover strong{font-size:12px}.course-body{min-width:0;display:flex;flex-direction:column}.course-body strong{font-size:13px;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.course-body small{font-size:11px;color:#68786f;line-height:1.6}.course-body .badge{margin-top:auto;align-self:flex-start}
    .recent-table{width:100%;border-collapse:collapse;font-size:12px}.recent-table th{background:#f5f8f6;text-align:left;color:#718077;font-weight:500;font-size:11px;padding:10px 14px}.recent-table td{padding:10px 14px;border-top:1px solid #edf1ee}.recent-table td:first-child{font-weight:650}.recent-table tr:hover td{background:#f8fbf9}
    .split{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:16px;align-items:start}.row-list{overflow:hidden}.course-row{display:grid;grid-template-columns:71px minmax(0,1fr) 92px 98px 58px;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid #e9efeb;min-height:76px}.course-row:last-child{border:0}.course-row .cover{width:71px;height:51px}.course-row .cover strong{font-size:9px}.course-row h3{font-size:13px;margin:0 0 5px}.course-row p{font-size:10px;color:#78877d;margin:0}.course-row .num{font-size:12px}.course-row .num small{display:block;font-size:10px;color:#869489}.right-stack{display:grid;gap:13px}.side-panel{padding:16px}.side-panel h3{font-size:13px;margin:0 0 12px}.side-panel .featured{font-size:15px;font-weight:700;line-height:1.4}.side-panel p{font-size:11px;color:#65776b;line-height:1.65;margin:8px 0 13px}.activity{border-top:1px solid #e7eeea;padding:10px 0;font-size:11px;line-height:1.45}.activity:first-of-type{border-top:0}.activity strong{display:block;color:#344a3d;margin-bottom:3px}.activity small{color:#87958c}
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{padding:13px 15px;display:flex;align-items:center;gap:10px}.stat strong{font-size:23px;color:#1c5e48}.stat span{font-size:11px;color:#65766b;line-height:1.4}.work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.work-card{padding:13px 15px}.work-top{display:flex;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid #ebf0ec}.work-top .cover{width:64px;height:47px;flex:none}.work-top .cover strong{font-size:9px}.work-top h3{margin:0 0 5px;font-size:13px}.work-top small{font-size:10px;color:#7a8a7e}.work-top .badge{margin-left:auto}.lesson{display:grid;grid-template-columns:86px minmax(0,1fr) 65px;gap:9px;align-items:center;border-bottom:1px solid #f0f3f0;padding:8px 0;font-size:11px}.lesson:last-child{border-bottom:0}.lesson .date{color:#66776e}.lesson strong{font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.lesson .state{text-align:right;color:#558769}.lesson .state.pending{color:#a2732d}
    .option-note{margin-top:17px;border-top:1px solid #d8e3dc;padding-top:10px;font-size:11px;color:#73847a}
    @media(max-width:1450px){.course-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr) 245px}.demo-switch .hint{display:none}}
    @media(max-width:1120px){.window{grid-template-columns:68px minmax(0,1fr)}aside{padding:22px 8px}.brand{justify-content:center;padding:0}.brand img{width:38px}.brand>div,.side-label,.nav span:not(.active),.side-bottom{display:none}.nav span{justify-content:center;padding:12px 4px;font-size:0}.nav b{font-size:17px}.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.right-stack{grid-template-columns:repeat(2,1fr)}.demo-switch .intro{min-width:0}}
    @media(max-width:740px){.content{padding:16px}.topbar{padding:0 15px}.demo-switch{flex-wrap:wrap}.demo-switch .intro{width:100%}.head{align-items:flex-start;flex-direction:column}.course-grid,.work-grid,.stat-row,.right-stack{grid-template-columns:1fr}.course-row{grid-template-columns:55px minmax(0,1fr) 64px}.course-row .cover{width:55px;height:42px}.course-row .badge,.course-row .num:nth-of-type(2){display:none}.resume .progress{display:none}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="window">
  <div class="titlebar"><img src="../public/app-icon.svg" alt="">课页 · 资料库布局提案 <span class="win-actions">− □ ×</span></div>
  <aside><div class="brand"><img src="../public/app-icon.svg" alt=""><div><strong>课页<span>KEYE</span></strong><small>个人课件资料库</small></div></div><div class="side-label">我的工作空间</div><div class="nav"><span class="active"><b>▦</b>资料库</span><span><b>↓</b>获取课件</span><span><b>☷</b>任务</span><span><b>ⓘ</b>关于</span></div><div class="side-bottom"><strong>本地资料库</strong>原始资料保存在本机<br>设置</div></aside>
  <div class="workspace"><div class="topbar"><span>工作空间　/　资料库</span><span class="right"><span class="pill">本地资料库</span>ⓘ　我</span></div><div class="content"><div class="demo-switch"><span class="intro">资料库首页 · 三种布局提案</span><button data-choice="a" class="active">A　紧凑卡片</button><button data-choice="b">B　课程列表</button><button data-choice="c">C　课程工作台</button><span class="hint">独立设计样稿 · 不连接实际资料</span></div><div id="variants"></div></div></div>
</div>
<script>
const courses=[
  {name:'机器学习',term:'2026 秋季学期',count:9,pages:295,pending:3,latest:'09-20',bg:'#f8f4e9',ink:'#78643d'},
  {name:'数学建模与优化',term:'2026 秋季学期',count:4,pages:123,pending:1,latest:'09-21',bg:'#edf6f5',ink:'#2e6968'},
  {name:'数据结构',term:'2026 秋季学期',count:11,pages:318,pending:2,latest:'09-19',bg:'#f1f4f8',ink:'#435d80'},
  {name:'高等数学',term:'2026 秋季学期',count:18,pages:526,pending:0,latest:'09-18',bg:'#f5f0f7',ink:'#6b5777'},
  {name:'计算机网络',term:'2026 秋季学期',count:7,pages:211,pending:1,latest:'09-16',bg:'#f8f0ec',ink:'#855c4a'},
  {name:'英语写作',term:'2026 秋季学期',count:6,pages:87,pending:0,latest:'09-13',bg:'#eef5ee',ink:'#386348'}
];
const lessons=[
  {date:'09-21',course:'数学建模与优化',name:'第 4 讲 · 非线性优化',pages:32,status:'待整理',cls:'warn'},
  {date:'09-20',course:'机器学习',name:'第 9 讲 · 神经网络基础',pages:42,status:'整理中',cls:'blue'},
  {date:'09-19',course:'数据结构',name:'第 11 讲 · 图的遍历',pages:28,status:'已导出',cls:''},
  {date:'09-18',course:'高等数学',name:'第 18 讲 · 多元积分',pages:36,status:'已导出',cls:''},
  {date:'09-16',course:'计算机网络',name:'第 7 讲 · 传输层',pages:31,status:'待整理',cls:'warn'}
];
const cover=c=>`<div class="cover" style="--bg:${c.bg};--ink:${c.ink}"><i class="stripe"></i><span class="micro">课页 / COURSE</span><strong>${c.name}</strong></div>`;
const badge=c=>`<span class="badge ${c.pending?'warn':''}">${c.pending?c.pending+' 份待整理':'已全部整理'}</span>`;
const head=(subtitle)=>`<div class="head"><div><h1>资料库</h1><p>${subtitle}</p></div><div class="actions"><button class="btn">新建课程</button><button class="btn">导入文件</button><button class="btn primary">获取课件</button></div></div>`;
const resume=()=>`<div class="panel resume"><div class="mini-cover">${cover(courses[1])}</div><div class="resume-copy"><span class="label">继续上次整理</span><strong>数学建模与优化 · 09-21 非线性优化</strong><small>上次看到第 18 / 32 页　·　保留 30 页</small></div><div class="progress"><i></i></div><button class="btn primary small">继续整理 →</button></div>`;
const tools=()=>`<div class="toolbar"><div class="tabs"><strong>全部课程　6</strong><span>有待整理　4</span><span>回收站</span></div><label class="search">⌕　<input placeholder="搜索课程、日期…"></label></div>`;
const section=(title,more='')=>`<div class="section-head"><h2>${title}</h2><span>${more}</span></div>`;
const a=()=>`${head('按课程归档，快速找到最近需要处理的课件。')}${resume()}${tools()}${section('我的课程','6 门课程 · 55 份课件')}<div class="course-grid">${courses.map(c=>`<div class="panel course-card">${cover(c)}<div class="course-body"><strong>${c.name}</strong><small>${c.count} 份课件 · ${c.pages} 页<br>最近更新 ${c.latest}</small>${badge(c)}</div></div>`).join('')}</div>${section('最近课件','按更新时间排序')}<div class="panel"><table class="recent-table"><thead><tr><th>日期</th><th>课程</th><th>课次 / 内容</th><th>页数</th><th>状态</th></tr></thead><tbody>${lessons.map(l=>`<tr><td>${l.date}</td><td>${l.course}</td><td>${l.name}</td><td>${l.pages} 页</td><td><span class="badge ${l.cls}">${l.status}</span></td></tr>`).join('')}</tbody></table></div><div class="option-note">A · 保留封面，但将封面缩成识别用的小图。单屏可看见更多课程和部分最近课件。</div>`;
const b=()=>`${head('课程优先：像文件管理器一样快速浏览与进入。')}${tools()}<div class="split"><div>${section('课程列表','名称 / 最近更新 / 课件量 / 状态')}<div class="panel row-list">${courses.map(c=>`<div class="course-row">${cover(c)}<div><h3>${c.name}</h3><p>${c.term} · 最新 ${c.latest}</p></div><div class="num">${c.count} 份<small>${c.pages} 页</small></div>${badge(c)}<span style="color:#579078;text-align:right">进入 →</span></div>`).join('')}</div></div><div class="right-stack"><div class="panel side-panel"><h3>继续整理</h3><div class="featured">数学建模与优化</div><p>09-21 非线性优化 · 上次看到第 18 / 32 页</p><button class="btn primary small">继续整理 →</button></div><div class="panel side-panel"><h3>最近动态</h3>${lessons.slice(0,4).map(l=>`<div class="activity"><strong>${l.course} · ${l.name}</strong><small>${l.date}　${l.status}</small></div>`).join('')}</div></div></div><div class="option-note">B · 减少装饰，最快浏览大量课程；继续整理与最近动态固定在右侧。</div>`;
const c=()=>`${head('把课程和最近课次放在同一层，直接找到要处理的内容。')}<div class="stat-row"><div class="panel stat"><strong>6</strong><span>门课程<br>已归档</span></div><div class="panel stat"><strong>55</strong><span>份课件<br>原始页面保留</span></div><div class="panel stat"><strong>7</strong><span>份待整理<br>可直接导出</span></div></div>${tools()}<div class="work-grid">${courses.map((c,i)=>`<div class="panel work-card"><div class="work-top">${cover(c)}<div><h3>${c.name}</h3><small>${c.count} 份课件 · ${c.pages} 页</small></div>${badge(c)}</div><div class="lesson"><span class="date">${c.latest}</span><strong>第 ${c.count} 讲 · ${['神经网络基础','非线性优化','图的遍历','多元积分','传输层','议论文结构'][i]}</strong><span class="state ${c.pending?'pending':''}">${c.pending?'待整理':'已整理'}</span></div><div class="lesson"><span class="date">09-${14-i}</span><strong>第 ${Math.max(1,c.count-1)} 讲 · 课堂课件</strong><span class="state">已导出</span></div></div>`).join('')}</div><div class="option-note">C · 课程与课次同屏；适合课程不多、但每门课需要经常进入不同课次的情况。</div>`;
document.getElementById('variants').innerHTML=`<section class="variant active" data-variant="a">${a()}</section><section class="variant" data-variant="b">${b()}</section><section class="variant" data-variant="c">${c()}</section>`;
document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('[data-variant]').forEach(x=>x.classList.toggle('active',x.dataset.variant===button.dataset.choice));document.querySelector('.content').scrollTop=0;}));
const chosen=location.hash.slice(1);if(['b','c'].includes(chosen))document.querySelector(`[data-choice="${chosen}"]`).click();
</script>
</body>
</html>
